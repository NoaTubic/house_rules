  Write your project's lint rules in YAML instead of building a custom_lint
  plugin. Design tokens, layering, widget and state-management rules.
version: 0.1.0
repository: https://github.com/NoaTubic/house_rules
issue_tracker: https://github.com/NoaTubic/house_rules/issues

topics:
  - lint
  - linter
  - static-analysis
  - code-quality
  - flutter

environment:
  sdk: ^3.11.0

dependencies:
  analyzer: ^14.0.0
  glob: ^2.1.2
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

executables:
  house_rules:
