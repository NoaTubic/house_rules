name: arch_guard
description: >-
  A fast, config-driven architecture linter for Dart and Flutter. Enforces
  layering, design-token and state-management rules the analyzer cannot
  express, with a ratchet baseline for existing codebases.
version: 0.1.0
repository: https://github.com/NoaTubic/arch_guard
issue_tracker: https://github.com/NoaTubic/arch_guard/issues

topics:
  - lint
  - linter
  - architecture
  - static-analysis
  - flutter

environment:
  sdk: ^3.6.0

dependencies:
  analyzer: ">=7.0.0 <9.0.0"
  glob: ^2.1.2
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

executables:
  arch_guard:
